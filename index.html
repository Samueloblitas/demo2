<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#ffffff;--bg2:#ffffff;--pill:#dcd9f8;--ink:#0f0f1e;--muted:#4f5870;--red:#f0404f;--navy:#3a4a68;--cloud:#d6d3f3;--card:#fff;--shadow:rgba(40,40,100,.08);--tab:#8b8b90;--ill:#e4e2f8;
  }
  @media (prefers-color-scheme: dark){
   :root {
  color-scheme: light;
  --bg: #ffffff;
  --bg2: #ffffff;
  --pill: #dcd9f8;
  --ink: #0f0f1e;
  --muted: #4f5870;
  --red: #f0404f;
  --navy: #3a4a68;
  --cloud: #d6d3f3;
  --card: #ffffff;
  --shadow: rgba(40,40,100,.08);
  --tab: #8b8b90;
  --ill: #e4e2f8;
}
  :root[data-theme="dark"]{--bg:#14142b;--bg2:#1b1b3a;--pill:#34336b;--ink:#f1f0ff;--muted:#a9adc4;--red:#ff5c69;--navy:#c7cde0;--cloud:#2c2b5a;--card:#222246;--shadow:rgba(0,0,0,.4);--ill:#26264f}
  html {
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  margin: 0;
  width: 100%;
  height: 100%;
  position: fixed;
  top: 0;
  left: 0;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  background: #ffffff;
  font-family: system-ui, sans-serif;
}

.app {
  width: 100%;
  max-width: 420px;
  height: 100%;
  box-sizing: border-box;
  margin: 0 auto;
  position: relative;
  padding: 14px 16px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}
box-sizing: border-box}
  .top{width:100%;display:flex;align-items:center;gap:14px}
  .back{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px var(--shadow)}
  .title{font-family:'Bebas Neue','Barlow Condensed',Impact,sans-serif;font-size:22px;letter-spacing:.5px;color:var(--ink)}
  .tab{position:absolute;right:0;top:140px;width:18px;height:70px;background:var(--tab);border-radius:10px 0 0 10px;display:grid;place-items:center;color:#fff;font-size:14px}
  .demo{margin-top:18px;background:var(--red);color:#fff;font-weight:700;font-size:12px;padding:4px 12px;border-radius:99px}
.clock {
  margin: 85px 0 8px;
  background: var(--pill);
  color: var(--ink);
  border-radius: 14px;
  padding: 10px 26px;
  font-size: 36px;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
}

.date {
  color: var(--muted);
  font-size: 18px;
  text-transform: none !important;
  margin-top: 10px;
  letter-spacing: 0.3px;
}
.photo {
  position: relative;
  z-index: 2;
  width: 112px;
  height: 112px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #fff;
  margin: 44px 0 0;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.scene {
  position: relative;
  width: calc(100% + 32px);
  margin: -45px -16px 0;
  height: 100px;
  flex-shrink: 0;
  z-index: 0;
}
.card {
  position: relative;
  z-index: 2;
  width: 100%;
  box-sizing: border-box;
  margin-top: -10px;
  background: var(--card);
  border-radius: 12px;
  padding: 20px 14px 18px;
  text-align: center;
  box-shadow: 0 4px 18px var(--shadow);
}
  .name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 38px;
  font-weight: 400;
  line-height: 1.1;
  color: #f0404f;
  margin: 0 0 12px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
  .lbl{font-size:13px;color:var(--ink);margin-top:6px}
  .val{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:17px;font-weight:700;color:var(--navy);letter-spacing:.5px}
  .career{margin:18px 0 8px;font-family:'Barlow Condensed',system-ui,sans-serif;font-size:17px;font-weight:700;color:var(--navy);text-transform:uppercase}
  .campus{font-size:13px;color:var(--ink)}
  .campus i{color:var(--red);font-style:normal}
  .foot{margin-top:14px;font-size:11px;color:var(--muted)}
.photo {
  position: relative;
  z-index: 2;
  width: 150px;
  height: 150px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #fff;
  margin: 90px 0 0;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  display: block;
}
    @keyframes moverNubes {
  from {
    transform: translateX(-15px);
  }
  to {
    transform: translateX(15px);
  }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="back"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" fill="none" stroke="#e03040" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

<script>
function tick() {
  const ahora = new Date();
  const dosDigitos = n => String(n).padStart(2, '0');

  const fecha = document.getElementById('date');

</body>
</html>
